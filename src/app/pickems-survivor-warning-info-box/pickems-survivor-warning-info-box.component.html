<ng-container *ngIf="displayModeWarning">
    <div class="container" *ngIf="shouldDisplay">
        <mat-card class="warning mat-elevation-z0">
            <mat-card-content style="padding: 0; padding-left: 25px; padding-right: 25px;">
                <mat-icon inline="true" style="margin-right: 3px;">warning</mat-icon>
                <strong>Warning:</strong> {{message}}
            </mat-card-content>
        </mat-card>
    </div>
</ng-container>
