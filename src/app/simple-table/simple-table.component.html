<table *ngIf="dataSource?.length > 0" [class]="className">
    <thead>
        <tr>
            <th *ngFor="let header of columnHeaders | keyvalue" [style]="colWidthStyle(header.key)">
                {{ header.value }}
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let row of dataSource">
            <td *ngFor="let obj of objectValues(row)" [innerHTML]="obj">
            </td>
        </tr>
    </tbody>
</table>
<div *ngIf="showCsvExport && dataSource?.length > 0" style="margin-top: 15px;">
    <button type="button" id="csvDownloadButton" (click)="exportCsv()"
        style="width: 200px; height: 50px; background-color: var(--accent-color);"><span
            style="font-size: medium; color: var(--text-color);">Export
            CSV</span></button>
</div>
