<div style="display: flex; width: 100%; align-items:end; justify-content: end;">
    <button mat-icon-button aria-label="Refresh" (click)="handleRefresh()"><mat-icon>refresh</mat-icon></button>
</div>

<h2 style="color: white;">Pick'ems Standings</h2>
<div class="score-container">
    <div class="score-table" *ngIf="scoresAvailable">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 ">

            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef> Profile Name </th>
                <td mat-cell *matCellDef="let player"> {{player.username}} </td>
            </ng-container>

            <ng-container matColumnDef="score">
                <th mat-header-cell *matHeaderCellDef> Score </th>
                <td mat-cell *matCellDef="let player"> {{player.score}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <div *ngIf="!scoresAvailable">
        <p>No scores are available yet!</p>
    </div>
</div>
